name: Build and Sign Android APK (CricStrike 3D)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 Headless & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf Godot_v4.3-stable_linux.x86_64.zip Godot_v4.3-stable_export_templates.tpz templates

      - name: Run Headless Automated Test Suite
        run: |
          godot --headless -s scripts/tests/headless_test_runner.gd

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CricStrike3D, OU=GameDev, O=Indie, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/cricket_raw.apk

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 build/cricket_raw.apk build/cricket_aligned.apk

      - name: Sign APK with apksigner (v1, v2, v3 schemes)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/cricket.apk \
            build/cricket_aligned.apk

      - name: Verify APK Signature Schemes
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build/cricket.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricket-apk
          path: build/cricket.apk
          if-no-files-found: error

      - name: Publish Direct APK Download on GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CricStrike 3D v1.0.0 Production Release"
          body: |
            ### 🏏 CricStrike 3D — Console-Quality Offline Mobile Cricket
            - 100% Offline Personal Play (Zero paywalls, Zero servers).
            - Android 14+ / API 34+ Compatible (Runs smoothly on Android 8 through 15+).
            - Realistic 3D Athletic Character Models, English Willow Bats, Chrome Visors.
            - 6 Broadcast TV Camera Angles + 3-Second Multi-Angle Slow-Mo Replay.
            - Full Decision Review System (DRS) with UltraEdge™ & Hawkeye™ 3D Ball Tracking.
            - Quick Match, Super Over, 8-Team World Tournament, and ₹100 Cr Mega Auction!
          files: build/cricket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
