name: CricStrike 3D Android CI & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    name: Headless Test, Export APK & Sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot 4.3 Engine & Export Templates
        run: |
          GODOT_VERSION="4.3-stable"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p /opt/godot

          echo "Downloading Godot 4.3 Linux Headless..."
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          mv /opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /opt/godot/godot
          chmod +x /opt/godot/godot
          echo "/opt/godot" >> $GITHUB_PATH

          echo "Downloading Godot 4.3 Export Templates..."
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Run Headless Verification Test Suite
        run: |
          /opt/godot/godot --headless scenes/test_runner.tscn

      - name: Create Android Debug Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK via Godot
        run: |
          mkdir -p build
          /opt/godot/godot --headless --export-debug "Android" build/cricket_raw.apk

      - name: Zipalign & Sign APK (v1, v2, v3 Signature Schemes)
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          $BUILD_TOOLS/zipalign -v -p 4 build/cricket_raw.apk build/cricket_aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/cricket.apk build/cricket_aligned.apk

          echo "Verifying apksigner output:"
          $BUILD_TOOLS/apksigner verify --verbose build/cricket.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricket-apk
          path: build/cricket.apk

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "CricStrike 3D v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🏏 CricStrike 3D Release APK
            - **Target OS**: Android 8.0 to Android 14+ (API 34)
            - **Signatures**: v1, v2, v3 verified
            - **Architecture**: arm64-v8a, armeabi-v7a
            - **Game Modes**: Quick Match, Super Over, World Tournament, Mega Auction, Locker Room Customizer
            - **Status**: 100% Offline, Zero Paywalls
          files: build/cricket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
